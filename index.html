<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>स्वतंत्रता दिवस</title>
  <meta name="description" content="वो देशभक्ति गाने जो स्कूल असेंबली में बजते थे — १५ अगस्त १९९५" />
  <meta property="og:title" content="स्वतंत्रता दिवस" />
  <meta property="og:description" content="वो देशभक्ति गाने जो स्कूल असेंबली में बजते थे — १५ अगस्त १९९५" />
  <meta property="og:image" content="/cover.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="hi_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/cover.jpg" />
  <link rel="icon" type="image/jpeg" href="/cover.jpg" />
</head>
<body>

  <!-- Fixed Top Bar -->
  <header class="top-bar">
    <span class="clock" id="clock">--:-- --</span>

    <div class="top-links">
      <a id="ytMusicLink" href="#" target="_blank" rel="noopener noreferrer" class="top-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>
        YT Music ↗
      </a>
    </div>
  </header>

  <!-- Center Stage: Big Title -->
  <main class="center-stage">
    <h1 class="site-title">स्वतंत्रता दिवस</h1>
  </main>

  <!-- Glassmorphism Pill Player (saloon.wtf style) -->
  <div class="player-pill">

    <!-- Spinning cover disc -->
    <div class="pill-cover">
      <div class="pill-disc paused" id="pillDisc">
        <img src="/cover.png" alt="cover art" />
      </div>
      <div class="pill-disc-dot"></div>
    </div>

    <!-- Song meta + progress bar -->
    <div class="pill-meta">
      <p class="pill-title" id="songTitle">ऐ मेरे वतन के लोगो</p>
      <p class="pill-artist" id="songArtist">लता मंगेशकर (आकाशवाणी)</p>
      <div class="pill-bar-wrap">
        <div class="pill-bar-track">
          <div class="pill-bar-fill" id="progressFill"></div>
          <div class="pill-bar-dot" id="progressDot"></div>
        </div>
        <input type="range" id="scrubberSlider" class="pill-scrubber" value="0" min="0" max="100" />
      </div>
      <div class="pill-time" id="timeDisplay">0:00 / 0:00</div>
    </div>

    <!-- Controls: shuffle, prev, play, next, playlist -->
    <div class="pill-controls">
      <button id="shuffleBtn" class="pill-ctrl" aria-label="Shuffle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button id="prevBtn" class="pill-ctrl" aria-label="Previous track">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="playPauseBtn" class="pill-ctrl pill-play" aria-label="Play">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="nextBtn" class="pill-ctrl" aria-label="Next track">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
      </button>
      <button id="playlistToggleBtn" class="pill-ctrl" aria-label="Open Playlist">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </button>
    </div>
  </div>

  <!-- Playlist Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop">
    <div class="playlist-drawer">
      <div class="drawer-header">
        <h3 class="drawer-title">१५ अगस्त असेंबली प्लेलिस्ट</h3>
        <button class="close-drawer-btn" id="closeDrawerBtn">✕</button>
      </div>
      <div class="track-list" id="trackListContainer"></div>
    </div>
  </div>

  <audio id="audioEngine" preload="metadata"></audio>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
